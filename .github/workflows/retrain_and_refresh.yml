name: AirSense - Scheduled Data Refresh & Model Retraining

on:
  schedule:
    # Runs daily at 00:00 UTC (05:30 AM IST)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions web interface
  push:
    branches:
      - main
      - master
    paths:
      - 'src/**'
      - 'data/raw/city_day.csv'

permissions:
  contents: write

jobs:
  pipeline:
    name: Execute AirSense Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Step 1 - Preprocessing & Outlier Handling
        run: python -m src.preprocessing

      - name: Step 2 - Weather Refresh & Feature Engineering
        run: python -m src.features

      - name: Step 3 - Retrain & Benchmark Forecasting Models
        run: python -m src.train

      - name: Step 4 - Compute SHAP Attributions & Figures
        run: python -m src.explain

      - name: Step 5 - Evaluate Alert Thresholds & Dispatch
        env:
          AQI_ALERT_THRESHOLD: ${{ secrets.AQI_ALERT_THRESHOLD }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          ALERT_EMAIL_SENDER: ${{ secrets.ALERT_EMAIL_SENDER }}
          ALERT_EMAIL_PASSWORD: ${{ secrets.ALERT_EMAIL_PASSWORD }}
          ALERT_EMAIL_RECIPIENT: ${{ secrets.ALERT_EMAIL_RECIPIENT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.alerts

      - name: Commit & Push Retrained Artifacts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add models/ data/processed/ reports/figures/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(pipeline): automated daily retraining & forecast update [skip ci]" && git push)
